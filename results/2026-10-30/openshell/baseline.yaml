{
  "version": 1,
  "filesystem_policy": {
    "include_workdir": true,
    "read_only": [
      "/bin",
      "/usr",
      "/lib",
      "/etc",
      "/proc",
      "/dev/urandom",
      "/var/log",
      "/matrix-private"
    ],
    "read_write": [
      "/sandbox",
      "/tmp",
      "/dev/null"
    ]
  },
  "landlock": {
    "compatibility": "hard_requirement"
  },
  "network_policies": {
    "collector": {
      "name": "local-collector-only",
      "endpoints": [
        {
          "host": "host.openshell.internal",
          "port": 19181,
          "protocol": "tcp"
        }
      ],
      "binaries": [
        {
          "path": "/usr/local/bin/python3.12"
        }
      ]
    }
  }
}
